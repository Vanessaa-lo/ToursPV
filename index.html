<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Tours PV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#f4f6f9;
            font-family:'Segoe UI', sans-serif;
        }

        .login-container{
            max-width:420px;
            margin:auto;
        }

        .login-card{
            border-radius:20px;
            box-shadow:0 8px 25px rgba(0,0,0,0.06);
            border:none;
            background:white;
        }

        .brand-title{
            font-weight:700;
            color:#0d6efd;
            letter-spacing:0.5px;
        }

        .subtitle{
            font-size:14px;
            color:#6c757d;
        }

        .form-control{
            border-radius:12px;
            padding:12px;
            border:1px solid #e3e6ea;
        }

        .form-control:focus{
            border-color:#0d6efd;
            box-shadow:0 0 0 2px rgba(13,110,253,0.12);
        }

        .btn-login{
            border-radius:50px;
            padding:12px;
            font-weight:500;
            transition:0.3s ease;
        }

        .btn-login:hover{
            transform:translateY(-1px);
        }

        .extra-links{
            font-size:13px;
        }

        .extra-links a{
            text-decoration:none;
            color:#6c757d;
        }

        .extra-links a:hover{
            color:#0d6efd;
        }
    </style>
</head>

<body>

<div class="d-flex align-items-center vh-100">

    <div class="login-container">

        <div class="card p-5 login-card">

            <div class="text-center mb-4">
                <h4 class="brand-title">Tours PV</h4>
                <p class="subtitle mb-0">Accede a tu cuenta para gestionar tus reservas</p>
            </div>

            <div class="mb-3">
                <label class="form-label small text-muted">Correo electrónico</label>
                <input type="email" id="usuario" class="form-control" placeholder="Ingresa tu correo electrónico">
            </div>

            <div class="mb-3">
                <label class="form-label small text-muted">Contraseña</label>
                <input type="password" id="password" class="form-control" placeholder="Ingresa tu contraseña">
            </div>

            <button class="btn btn-primary btn-login w-100 mt-2" onclick="login()">
                Ingresar
            </button>

            <div class="text-center mt-4 extra-links">
                <a href="registro_cliente.html">Crear una cuenta</a>
            </div>

            <div class="text-center mt-4 extra-links">
                <a href="#">¿Olvidaste tu contraseña?</a>
            </div>


        </div>

    </div>

</div>
<script>

function login(){

    let usuario = document.getElementById("usuario").value;
    let password = document.getElementById("password").value;

    // simulación de roles
    if(usuario === "admin" && password === "admin"){
        window.location.href = "dashboard.html";
    }
    else if(usuario === "cliente" && password === "cliente"){
        window.location.href = "cliente_home.html";
    }
    else{
        alert("Usuario o contraseña incorrectos");
    }

}
</script>

</body>
</html>
