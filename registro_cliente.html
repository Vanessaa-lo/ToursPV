<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Cuenta | Tours PV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
        }
        .card {
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(56, 33, 33, 0.05);
        }
        .btn-primary {
            background-color: #2563eb;
            border: none;
        }
    </style>
</head>
<body>

<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4" style="width:420px;">
        
        <h3 class="text-center mb-3">Crear Cuenta</h3>

        <form>

            <div class="mb-3">
                <label class="form-label">Nombre Completo</label>
                <input type="text" class="form-control" placeholder="Ana López">
            </div>

            <div class="mb-3">
                <label class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" placeholder="correo@email.com">
            </div>

            <div class="mb-3">
                <label class="form-label">Teléfono</label>
                <input type="tel" class="form-control" placeholder="3221234567">
            </div>

            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Confirmar Contraseña</label>
                <input type="password" class="form-control">
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Crear Cuenta
            </button>

        </form>

        <p class="text-center mt-3">
            ¿Ya tienes cuenta?
            <a href="index.html">Iniciar sesión</a>
        </p>

    </div>
</div>

</body>
</html>
