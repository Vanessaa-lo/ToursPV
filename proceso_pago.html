<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proceso de Pago</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background-color:#f4f6f9;
    font-family: 'Segoe UI', sans-serif;
}

.payment-container{
    max-width:600px;
    margin:50px auto;
}

.payment-card{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.service-img{
    width:100%;
    height:240px;
    object-fit:cover;
}

.content{
    padding:30px;
}

.summary-box{
    background:#f8f9fa;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
}

.stripe-box{
    border:1px solid #e9ecef;
    border-radius:15px;
    padding:20px;
    background:#ffffff;
}

.fake-stripe-input{
    width:100%;
    padding:12px;
    border:1px solid #dee2e6;
    border-radius:10px;
    margin-bottom:12px;
    transition:0.2s;
}

.fake-stripe-input:focus{
    border-color:#0d6efd;
    box-shadow:0 0 0 2px rgba(13,110,253,0.15);
    outline:none;
}

.btn-premium{
    background:#0d6efd;
    color:white;
    border-radius:50px;
    padding:12px;
    font-weight:500;
    transition:0.3s;
}

.btn-premium:hover{
    background:#0b5ed7;
}

.back-link{
    text-decoration:none;
    font-size:14px;
    color:#6c757d;
}

.back-link:hover{
    color:#0d6efd;
}
</style>
</head>

<body>

<div class="payment-container">

    <div class="payment-card">

        <!-- Imagen del servicio -->
        <img src="https://images.unsplash.com/photo-1567899378494-47b22a2ae96a"
             class="service-img"
             alt="Servicio">

        <div class="content">

            <a href="cliente_home.html" class="back-link">
                ← Regresar
            </a>

            <h4 class="fw-bold mt-3 mb-4">Confirmar Pago</h4>

            <!-- Resumen -->
            <div class="summary-box">
                <p class="mb-1"><strong>Cliente:</strong> Ana López</p>
                <p class="mb-1"><strong>Servicio:</strong> Yate de Lujo</p>
                <p class="mb-1"><strong>Fecha:</strong> 19/08/2025</p>
                <p class="mb-0 fs-5"><strong>Total:</strong> $15,000 MXN</p>
            </div>

            <!-- Tarjeta -->
            <div class="stripe-box">

                <p class="fw-semibold mb-3">Pago con Tarjeta</p>

                <input type="text" class="fake-stripe-input" placeholder="Número de tarjeta">
                
                <div class="row">
                    <div class="col">
                        <input type="text" class="fake-stripe-input" placeholder="MM / AA">
                    </div>
                    <div class="col">
                        <input type="text" class="fake-stripe-input" placeholder="CVC">
                    </div>
                </div>

                <button class="btn btn-premium w-100 mt-3">
                    Pagar $15,000 MXN
                </button>

                <p class="text-muted small text-center mt-3 mb-0">
                    Pago seguro procesado por Stripe
                </p>

            </div>

        </div>

    </div>

</div>

</body>
</html>
