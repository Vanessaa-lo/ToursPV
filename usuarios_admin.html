<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Usuarios - Tours PV</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background-color:#f4f6f9;
    font-family:'Segoe UI', sans-serif;
}

        /* SIDEBAR */
        .sidebar {
            height: 100vh;
            width: 250px;
            background-color: #1e293b;
            position: fixed;
            color: white;
        }

        .sidebar h4 {
            padding: 20px;
            font-weight: bold;
        }

        .sidebar a {
            display: block;
            color: #cbd5e1;
            padding: 10px 15px;
            text-decoration: none;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background-color: #334155;
            color: white;
        }

        .sidebar .active {
            background-color: #2563eb;
            color: white;
        }

.main-content{
    margin-left:250px;
    padding:30px;
}

.section-card{
    background:white;
    border-radius:18px;
    padding:25px;
    box-shadow:0 8px 25px rgba(0,0,0,0.05);
}

.badge-status{
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
}

.badge-activo{
    background:#d1e7dd;
    color:#0f5132;
}

.badge-inactivo{
    background:#f8d7da;
    color:#842029;
}

.btn-sm{
    border-radius:20px;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h4>Tours PV Admin</h4>

    <a href="dashboard.html">Dashboard</a>
    <a href="gestion_yates.html">Gestión de Yates</a>
    <a href="gestion_tours.html">Gestión de Tours</a>
    <a href="reservas_admin.html">Reservas</a>
    <a href="usuarios_admin.html" class="active">Usuarios</a>


    <a href="#">Cerrar sesión</a>
</div>

<div class="main-content">

    <h3 class="mb-4">Gestión de Usuarios</h3>

    <div class="section-card">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0">Lista de Usuarios</h5>
            <button class="btn btn-primary btn-sm">+ Nuevo Usuario</button>
        </div>

        <table class="table align-middle">
            <thead class="table-light">
                <tr>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th class="text-end">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Ana López</td>
                    <td>ana@email.com</td>
                    <td>Cliente</td>
                    <td><span class="badge badge-status badge-activo">Activo</span></td>
                    <td class="text-end">
                        <button class="btn btn-outline-primary btn-sm">Editar</button>
                        <button class="btn btn-outline-warning btn-sm">Desactivar</button>
                        <button class="btn btn-outline-danger btn-sm">Eliminar</button>
                    </td>
                </tr>

                <tr>
                    <td>Carlos Ruiz</td>
                    <td>carlos@email.com</td>
                    <td>Administrador</td>
                    <td><span class="badge badge-status badge-inactivo">Inactivo</span></td>
                    <td class="text-end">
                        <button class="btn btn-outline-primary btn-sm">Editar</button>
                        <button class="btn btn-outline-success btn-sm">Activar</button>
                        <button class="btn btn-outline-danger btn-sm">Eliminar</button>
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

</div>

</body>
</html>
