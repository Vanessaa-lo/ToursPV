<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Recuperar contraseña - Tours PV</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background-color:#f4f6f9;
    font-family:'Segoe UI', sans-serif;
}

.recover-card{
    width:420px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
    border:none;
}

.form-control{
    border-radius:10px;
    padding:10px;
}

.form-control:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 2px rgba(37,99,235,0.15);
}

.btn-recover{
    border-radius:50px;
    padding:10px;
    font-weight:500;
}

.brand-title{
    font-weight:600;
    color:#2563eb;
}

.back-link{
    text-decoration:none;
    font-size:14px;
}

.back-link:hover{
    text-decoration:underline;
}

.success-icon{
    font-size:50px;
}
</style>
</head>

<body>

<div class="d-flex justify-content-center align-items-center vh-100">

    <div class="card p-4 recover-card">

        <!-- FORMULARIO -->
        <div id="formSection">

            <div class="text-center mb-4">
                <h4 class="brand-title">Tours PV</h4>
                <p class="text-muted mb-0">Recuperar contraseña</p>
            </div>

            <p class="text-muted text-center mb-4">
                Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.
            </p>

            <form onsubmit="mostrarConfirmacion(event)">

                <div class="mb-3">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" placeholder="ejemplo@email.com" required>
                </div>

                <button class="btn btn-primary btn-recover w-100 mb-3">
                    Enviar enlace de recuperación
                </button>

                <div class="text-center">
                    <a href="index.html" class="back-link text-primary">
                        ← Volver al inicio de sesión
                    </a>
                </div>

            </form>

        </div>


        <!-- CONFIRMACION -->
        <div id="successSection" style="display:none;">

            <div class="text-center">

                <div class="success-icon mb-3">
                    📧
                </div>

                <h5 class="mb-2">Revisa tu correo</h5>

                <p class="text-muted mb-4">
                    Hemos enviado un enlace para restablecer tu contraseña.
                    Si no lo ves, revisa tu carpeta de spam.
                </p>

                <a href="index.html" class="btn btn-primary btn-recover w-100">
                    Volver al login
                </a>

            </div>

        </div>

    </div>

</div>

<script>

function mostrarConfirmacion(e){
    e.preventDefault();

    document.getElementById("formSection").style.display="none";
    document.getElementById("successSection").style.display="block";
}

</script>

</body>
</html>
